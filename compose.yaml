name: little-mester

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      #OLLAMA_CONTEXT_LENGTH: "32768"
      OLLAMA_CONTEXT_LENGTH: "131072"
      OLLAMA_KEEP_ALIVE: "-1"        # keep the model loaded; reloading 24GB is slow
      OLLAMA_MAX_LOADED_MODELS: "1"  # only one model resident at a time
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]            # no internet, no published ports
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: the ONLY service with internet. Used by `./lab setup`.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: [setup]
    entrypoint: ["/bin/sh", "/pull-models.sh"]
    volumes:
      - ollama-models:/root/.ollama
      - ./ollama/pull-models.sh:/pull-models.sh:ro
      - ./models.txt:/models.txt:ro
    networks: [egress]

  agent:
    build:
      context: ./agent
      args:
        LAB_UID: "${LAB_UID:-1000}"
        LAB_GID: "${LAB_GID:-1000}"
    profiles: [agent]
    depends_on:
      ollama:
        condition: service_healthy
      metrics:
        condition: service_healthy
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    working_dir: /workspace
    volumes:
      - "${WORKSPACE:?run via ./lab}:/workspace:${MOUNT_MODE:-rw}"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:exec,mode=1777,size=512m
      - /home/agent:uid=${LAB_UID:-1000},gid=${LAB_GID:-1000},mode=0700
    mem_limit: 8g
    pids_limit: 512
    environment:
      HOME: /home/agent
      OLLAMA_API_BASE: http://ollama:11434
      # Swap out AIDER models
      #AIDER_MODEL: ollama_chat/qwen2.5-coder:7b
      AIDER_MODEL: ollama_chat/qwen3.6:35b-a3b
      AIDER_CHECK_UPDATE: "false"
      AIDER_ANALYTICS_DISABLE: "true"
    networks: [egress, internal]    # default egress=true → both; false → [internal]
    stdin_open: true
    tty: true

  # Lightweight sidecar: exposes host GPU / CPU / RAM / temperature data via HTTP (loopback only).
  # The agent queries it programmatically; the TUI polls /summary for the live status bar.
  metrics:
    build: ./agent/metrics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ utility ]
    networks: [internal]              # internal only — no ports published to host
    user: root                      # needed to read from /proc and device nodes
    cap_drop: [ALL]                 # drop all Linux capabilities
    security_opt: ["no-new-privileges:true"]
    read_only: true                 # immutable filesystem
    tmpfs:
      - /tmp:size=16m               # minimal writable space for cache/sockets
    volumes:
      - ./agent/metrics:/app:ro     # source code (read-only even to this container)
      - /proc:/host/proc:ro         # CPU stats, load averages, meminfo
      - /sys/class/hwmon:/host/hwmon:ro   # temperature sensors (chip die, chipset)
      - /sys/class/thermal:/host/thermal:ro   # thermal zones (GPU die, VRAM junction)
    # Healthcheck lives in compose (not the image) so it applies on every
    # `docker compose run` without requiring an image rebuild.
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:19532/summary', timeout=2).status == 200 else 1)"]
      interval: 5s
      timeout: 3s
      start_period: 3s
      retries: 5
    restart: unless-stopped

networks:
  internal:
    internal: true
  egress: {}

volumes:
  ollama-models:
