# machine.conf — hardware profile for this machine
#
# Filled in for: NVIDIA RTX 5070 Mobile + AMD Radeon integrated
#   GPU: RTX 5070 Mobile, 8GB VRAM (primary)
#   CPU: Intel (check your exact model)
#
# These values are starting points. Run ./lab tune to find your optimum.

# ── Hardware ──────────────────────────────────────────────────────────────
GPU_NAME="NVIDIA GeForce RTX 5070 Mobile"
GPU_VRAM_GB=8
CPU_CORES=0
CPU_MODEL=""

# ── Tuning defaults ───────────────────────────────────────────────────────
# Threads: 10 out of 12 cores (leave 2 for system, background tasks)
#   The HX 370 has excellent single-thread perf, so 10 threads is a sweet spot.
#   Don't go to 12 — you'll starve the OS and cause throttling.
DEFAULT_THREADS=10

# CPU-MoE: 32 experts on CPU.
#   The Qwen3.6-35B-A3B is a MoE model (~20GB at Q4_K_M).
#   With only 8GB VRAM, most of the model has to live in RAM anyway.
#   32 is a safe starting point. Lower if you see CPU bottleneck, higher if GPU-bound.
DEFAULT_CPU_MOE=32

# Micro-batch: 2048 tokens.
#   Larger batches = higher throughput but more VRAM for KV cache.
#   2048 is conservative and safe for 8GB VRAM.
#   If your results show headroom, try 4096 in a sweep.
DEFAULT_MICRO_BATCH=2048

# Context: 65536 tokens.
#   The model supports up to 131072 natively, but 65536 gives good performance
#   with reasonable VRAM usage. Reduce to 16384 or 32768 if VRAM is tight.
DEFAULT_CONTEXT_LENGTH=65536
