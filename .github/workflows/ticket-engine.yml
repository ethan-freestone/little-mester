name: ticket-engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ticket-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test, and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: little-mester-mcp
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: little-mester-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check package entry points and tarball
        run: npm run check:package

      - name: Run engine, CLI, and MCP suites
        run: npm test

      - name: Validate the committed ticket store
        run: ./scripts/ticket-engine validate

      - name: Ensure checks did not mutate tracked files
        working-directory: .
        run: git diff --exit-code
