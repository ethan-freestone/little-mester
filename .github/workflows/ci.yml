name: little-mester checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Parallel jobs ──────────────────────────────────────────────────
# Each job is independent and runs on ubuntu-latest.
# They start simultaneously and report together, so future
# aggregate reporting (PR checks, dashboards) just works.

jobs:
  # ── 1. TypeScript / Node ─────────────────────────────────────────
  node:
    name: Build & test (TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: little-mester-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: little-mester-mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:package
      - run: npm test

  # ── 2. Bats — lab script, TUI JSX guard, exit-confirm static ────
  bats:
    name: Bats (lab, TUI JSX, exit-confirm)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Bats and report its provenance
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          bats_core_commit="$(git -C /tmp/bats rev-parse HEAD)"
          sudo /tmp/bats/install.sh /usr/local
          rm -rf /tmp/bats
          printf 'bats-core commit: %s\n' "$bats_core_commit"
          bats --version
      - name: Run Bats with failure output
        run: bats --print-output-on-failure tests/

  # ── 3. Persistent-parent Python integration/unit suites ─────────
  parent-python:
    name: Persistent parent (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install local OpenSSH server for production-path pin regression
        run: sudo apt-get update -qq && sudo apt-get install -y openssh-server
      - name: Run parent suites
        run: |
          python3 tests/vm-owner-acceptance.test.py
          python3 tests/vm-guest-user-dirs.test.py
          for test in tests/vm-parent-*.test.py; do
            python3 "$test"
          done

  # ── Hosted-runner disposable M2 guest integration; no TCG fallback ──
  real-qemu-kvm-trial:
    name: Real QEMU KVM M2 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Report runner architecture, identity, and initial KVM device state
        run: |
          printf 'runner_label=ubuntu-24.04\narchitecture=%s\n' "$(uname -m)"
          id
          if [[ -e /dev/kvm || -L /dev/kvm ]]; then
            stat -c 'path=%n type=%F mode=%a owner=%U group=%G' -- /dev/kvm
            if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              printf 'kvm_access=read-write\n'
            else
              printf 'kvm_access=not-read-write\n'
            fi
          else
            printf 'kvm_device=absent\n'
          fi
      - name: Apply GitHub-documented KVM udev permissions when needed
        run: |
          if [[ -c /dev/kvm && ( ! -r /dev/kvm || ! -w /dev/kvm ) ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [[ -e /dev/kvm || -L /dev/kvm ]]; then
            stat -c 'path=%n type=%F mode=%a owner=%U group=%G' -- /dev/kvm
          else
            printf 'kvm_device=absent-after-udev\n'
          fi
      - name: Install disposable-VM host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cloud-image-utils curl genisoimage openssh-client openssh-server qemu-system-x86 \
            qemu-utils socat virtiofsd
      - name: Require usable KVM and run credential-free M2 guest integration
        run: bash tests/ci-kvm-capability.sh
      - name: Exercise synthetic OAuth callback bridge over real local OpenSSH
        run: python3 tests/vm-browser-auth.test.py

  # ── 4. Hygiene — ShellCheck, Python compile, ruff lint ───────────
  hygiene:
    name: Hygiene (shellcheck, py_compile, ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: ShellCheck (lab + shell scripts)
        run: shellcheck lab scripts/*.sh

      - name: Python compile check (scripts/*.py)
        run: python3 -m py_compile scripts/*.py

      - name: Install ruff and lint Python
        run: pip install --target=/tmp/.ruff ruff && /tmp/.ruff/bin/ruff check scripts/*.py agent/metrics/gather.py bench/bench.py

  # ── 5. Ticket store ──────────────────────────────────────────────
  ticket-store:
    name: Ticket store validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: little-mester-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: little-mester-mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: ./scripts/ticket-engine validate
      - run: git diff --exit-code
