name: little-mester checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/vm-approach-3]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Parallel jobs ──────────────────────────────────────────────────
# Each job is independent and uses a pinned Ubuntu LTS image.
# They start simultaneously and report together, so future
# aggregate reporting (PR checks, dashboards) just works.

jobs:
  # ── 1. TypeScript / Node ─────────────────────────────────────────
  node:
    name: Build & test (TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: little-mester-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: little-mester-mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:package
      - run: npm test

  # ── 2. Bats — lab script, TUI JSX guard, exit-confirm static ────
  bats:
    name: Bats (lab, TUI JSX, exit-confirm)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Bats and report its provenance
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          bats_core_commit="$(git -C /tmp/bats rev-parse HEAD)"
          sudo /tmp/bats/install.sh /usr/local
          rm -rf /tmp/bats
          printf 'bats-core commit: %s\n' "$bats_core_commit"
          bats --version
      - name: Run Bats with failure output
        run: bats --print-output-on-failure tests/

  # ── 3. VM unit & contract tests ──────────────────────────────────
  vm-unit-contract:
    name: VM unit & contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install local OpenSSH server for production-path pin regression
        run: |
          mapfile -t packages < <(python3 -I lib/vm/host-dependencies.py ci-tools --list-packages apt)
          test "${#packages[@]}" -gt 0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends --no-upgrade --no-remove "${packages[@]}"
      - name: Install pinned OpenCode for real-binary config and TUI regressions
        run: |
          sudo npm install --global @opencode/cli@2.2.5
          test "$(opencode --version)" = 'opencode v2.2.5'
      - name: Run parent suites
        run: |
          python3 tests/opencode-project-config.test.py
          python3 tests/ci-tui-diagnostic.test.py
          python3 tests/ci-tui-capture.test.py
          python3 tests/ci-kvm-qemu-stop.test.py
          python3 tests/ci-kvm-ssh.test.py
          python3 tests/ci-kvm-contract.test.py
          python3 tests/ci-kvm-stage-state.test.py
          python3 tests/ci-kvm-qemu-owner.test.py
          python3 tests/vm-owner-acceptance.test.py
          python3 tests/vm-systemd.test.py
          python3 tests/vm-host-dependencies.test.py
          python3 tests/ci-kvm-system-unit.test.py
          python3 tests/ci-kvm-host-dependencies.test.py
          python3 tests/vm-guest-user-dirs.test.py
          python3 tests/ci-qemu-oauth-bridge.test.py
          python3 tests/ci-kvm-launch.test.py
          python3 tests/ci-kvm-hostkey.test.py
          for test in tests/vm-parent-*.test.py; do
            python3 "$test"
          done

  # ── 4. Transient hosted QEMU guest integration; no TCG fallback ───
  transient-qemu-integration:
    name: Transient QEMU guest integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LM_CI_RUN_ID: ${{ github.run_id }}
      LM_CI_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Initialize private KVM state path
        shell: bash
        run: |
          : "${RUNNER_TEMP:?RUNNER_TEMP is required}" "${GITHUB_ENV:?GITHUB_ENV is required}"
          [[ "$RUNNER_TEMP" == /* && "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          state_dir="$RUNNER_TEMP/little-mester-transient-kvm-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'LM_CI_STATE_DIR=%s\n' "$state_dir" >> "$GITHUB_ENV"
      - name: Verify and report source-head and workflow SHA provenance
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$actual_sha" = "$GITHUB_SHA"
          printf 'source_head_sha=%s\nworkflow_sha=%s\nevent=%s\n' \
            "$SOURCE_HEAD_SHA" "$GITHUB_SHA" "$GITHUB_EVENT_NAME"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            merge_parent="$(git rev-parse HEAD^2)"
            test "$merge_parent" = "$SOURCE_HEAD_SHA"
            printf 'pr_merge_commit_second_parent=%s\n' "$merge_parent"
          else
            test "$SOURCE_HEAD_SHA" = "$actual_sha"
          fi
      - name: Report runner architecture, identity, and initial KVM device state
        run: |
          printf 'runner_label=ubuntu-24.04\narchitecture=%s\n' "$(uname -m)"
          id
          if [[ -e /dev/kvm || -L /dev/kvm ]]; then
            stat -c 'path=%n type=%F mode=%a owner=%U group=%G' -- /dev/kvm
            if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              printf 'kvm_access=read-write\n'
            else
              printf 'kvm_access=not-read-write\n'
            fi
          else
            printf 'kvm_device=absent\n'
          fi
      - name: Apply GitHub-documented KVM udev permissions when needed
        run: |
          if [[ -c /dev/kvm && ( ! -r /dev/kvm || ! -w /dev/kvm ) ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [[ -e /dev/kvm || -L /dev/kvm ]]; then
            stat -c 'path=%n type=%F mode=%a owner=%U group=%G' -- /dev/kvm
          else
            printf 'kvm_device=absent-after-udev\n'
          fi
      - name: Update Ubuntu package indexes for disposable KVM
        timeout-minutes: 4
        run: bash tests/ci-kvm-host-dependencies.sh update
      - name: Install disposable-VM host dependencies
        timeout-minutes: 10
        run: bash tests/ci-kvm-host-dependencies.sh install
      - name: Prepare disposable guest and pinned inputs
        timeout-minutes: 5
        run: bash tests/ci-kvm-stage.sh --stage prepare --run-dir "$LM_CI_STATE_DIR"
      - name: Probe shared QEMU builder with bounded disposable KVM launch
        timeout-minutes: 2
        run: python3 tests/ci-kvm-shared-launch-probe.py --run-dir "$LM_CI_STATE_DIR"
      - name: Start real KVM guest and prove strict SSH readiness
        timeout-minutes: 5
        run: bash tests/ci-kvm-stage.sh --stage boot --run-dir "$LM_CI_STATE_DIR"
      - name: Verify protected OpenCode config, TUI, and tmux
        timeout-minutes: 5
        run: bash tests/ci-kvm-stage.sh --stage config-tmux --run-dir "$LM_CI_STATE_DIR"
      - name: Verify restricted reboot, persistence, and egress
        timeout-minutes: 5
        run: bash tests/ci-kvm-stage.sh --stage restricted-reboot-egress-persistence --run-dir "$LM_CI_STATE_DIR"
      - name: Exercise synthetic OAuth and browser-auth regressions
        timeout-minutes: 5
        run: |
          bash tests/ci-kvm-stage.sh --stage synthetic-oauth --run-dir "$LM_CI_STATE_DIR"
          python3 tests/vm-browser-auth.test.py
      - name: Exercise live OAuth harness cancellation cleanup
        timeout-minutes: 2
        run: python3 tests/ci-kvm-oauth-cleanup.test.py
      - name: Prove final identity-safe cleanup
        id: smoke_cleanup
        if: always()
        timeout-minutes: 3
        run: bash tests/ci-kvm-stage.sh --stage cleanup --run-dir "$LM_CI_STATE_DIR"

  # ── 5. Exact installed production acceptance on its own hosted KVM runner ──
  production-systemd-vm-acceptance:
    name: Production systemd VM acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LM_CI_RUN_ID: ${{ github.run_id }}
      LM_CI_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify and report source-head and workflow SHA provenance
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_sha="$(git rev-parse HEAD)"
          [[ "$SOURCE_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$actual_sha" = "$GITHUB_SHA"
          printf 'source_head_sha=%s\nworkflow_sha=%s\nevent=%s\n' \
            "$SOURCE_HEAD_SHA" "$GITHUB_SHA" "$GITHUB_EVENT_NAME"
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            merge_parent="$(git rev-parse HEAD^2)"
            test "$merge_parent" = "$SOURCE_HEAD_SHA"
            printf 'pr_merge_commit_second_parent=%s\n' "$merge_parent"
            printf 'LM_CI_PR_MERGE_PARENT_SHA=%s\n' "$merge_parent" >> "$GITHUB_ENV"
          else
            test "$SOURCE_HEAD_SHA" = "$actual_sha"
            printf 'LM_CI_PR_MERGE_PARENT_SHA=not-applicable\n' >> "$GITHUB_ENV"
          fi
      - name: Report runner architecture, identity, and initial KVM device state
        run: |
          printf 'runner_label=ubuntu-24.04\narchitecture=%s\n' "$(uname -m)"
          id
          if [[ -e /dev/kvm || -L /dev/kvm ]]; then
            stat -c 'path=%n type=%F mode=%a owner=%U group=%G' -- /dev/kvm
            if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              printf 'kvm_access=read-write\n'
            else
              printf 'kvm_access=not-read-write\n'
            fi
          else
            printf 'kvm_device=absent\n'
          fi
      - name: Apply GitHub-documented KVM udev permissions when needed
        run: |
          if [[ -c /dev/kvm && ( ! -r /dev/kvm || ! -w /dev/kvm ) ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi
          if [[ -e /dev/kvm || -L /dev/kvm ]]; then
            stat -c 'path=%n type=%F mode=%a owner=%U group=%G' -- /dev/kvm
          else
            printf 'kvm_device=absent-after-udev\n'
          fi
      - name: Update Ubuntu package indexes for production KVM
        timeout-minutes: 4
        run: bash tests/ci-kvm-host-dependencies.sh update
      - name: Install disposable-VM host dependencies
        id: host_dependencies
        timeout-minutes: 10
        run: |
          bash tests/ci-kvm-host-dependencies.sh install
      - name: Exercise exact pinned production systemd VM unit on disposable hosted KVM
        if: ${{ !cancelled() && steps.host_dependencies.outcome == 'success' }}
        timeout-minutes: 45
        run: python3 tests/ci-kvm-system-unit.py
      - name: Require production systemd VM and proxy stopped
        if: always()
        timeout-minutes: 2
        run: python3 tests/ci-kvm-system-unit.py --cleanup

  # ── 6. Hygiene — ShellCheck, Python compile, ruff lint ───────────
  hygiene:
    name: Hygiene (shellcheck, py_compile, ruff)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: ShellCheck (lab + shell scripts)
        run: shellcheck lab scripts/*.sh

      - name: Python compile check (scripts/*.py)
        run: python3 -m py_compile scripts/*.py

      - name: Install ruff and lint Python
        run: pip install --target=/tmp/.ruff ruff && /tmp/.ruff/bin/ruff check scripts/*.py agent/metrics/gather.py bench/bench.py
      - name: Validate GitHub Actions workflows
        run: scripts/check-workflows.sh

  # ── 7. Ticket store ─────────────────────────────────────────────
  ticket-store:
    name: Ticket store validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: little-mester-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: little-mester-mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: ./scripts/ticket-engine validate
      - run: git diff --exit-code
