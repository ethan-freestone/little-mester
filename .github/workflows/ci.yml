name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  bats:
    name: BATS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: Run BATS tests
        run: bats tests/

  ticket-engine:
    name: Ticket engine (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: little-mester-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: little-mester-mcp/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
